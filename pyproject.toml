[tool.poetry]
name = "three-body-integrability-wp1"
version = "0.1.0"
description = "High-precision three-body problem integrability research"
authors = ["Jacob Sullivan <jacobrsullivan@gmail.com>"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
numpy = ">=1.24,<2.3"
scipy = "^1.16.1"
matplotlib = "^3.10.5"
jupyterlab = "^4.4.5"
pytest = "^8.4.1"
h5py = "^3.14.0"
pyarrow = "^21.0.0"
rebound = "^4.4.10"
numba = ">=0.59"
pybind11 = "^2.13.0"
snakemake = "^8.0.0"

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
flake8 = "^7.3.0"
pre-commit = "^4.2.0"
mypy = "^1.17.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
